<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleaa</title>

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="header">
        <nav>Fleaa</nav>
    </header>
    <main>
        <section class="main card">
            <h3 class="main__category">FILM</h3>
            <img src="./assets/image.jpg" 
                class="main__image" 
                width="400" 
                height="800" 
                loading="lazy" />
            <div class="main__info">
                <h1 class="main__title">2001 A space Odyssey</h1>
                <p class="main__description">Humanity finds a mysterious object buried beneath the lunar surface and sets off to find its origins with the help of HAL 9000, the world’s most advanced super computer.</p>
                <div class="main__ribbon">
                    <p class="main__runtime">2:29 hours</p>
                    <p class="main__rating">4.2 stars</p>
                    <ul class="main__genres">
                        <li class="main__genre">
                            science fiction
                        </li>
                        <li class="main__genre">
                            adventure
                        </li>
                        <li class="main__genre">
                            mystery
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
